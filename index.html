<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CorePilot</title>
    <!-- Paint the base color before the bundle loads (no white flash). The OSD
         window loads this same page with ?osd and must stay transparent. -->
    <style>
      html, body, #root { margin: 0; height: 100%; }
      html { background: #0c0c0e; }
      html.osd, html.osd body { background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
